<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Summary</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: #f9f9f9;
      color: #333;
      text-align: center;
      padding: 60px 20px;
    }

    .order-box {
      background: #fff;
      max-width: 700px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .order-box h2 {
      color: #00b35a;
      margin-bottom: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #e6f7f0;
      color: #033d2c;
    }

    .total {
      font-weight: bold;
      color: #00b35a;
      font-size: 1.2rem;
    }

    .btn {
      display: inline-block;
      background: #00b35a;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn:hover {
      background: #00994d;
    }

    .remove-btn {
      background: #ff4d4d;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .remove-btn:hover {
      background: #e60000;
    }

    .action-buttons {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-top: 20px;
      gap: 10px;
    }
  </style>
</head>

<body>

  <div class="order-box">
    <h2>Your Order Summary</h2>

    <table id="orderTable">
      <thead>
        <tr>
          <th>Dish</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Total</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody>
        <!-- Orders inserted by JS -->
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3"><strong>Grand Total</strong></td>
          <td colspan="2" class="total" id="grandTotal">₹0</td>
        </tr>
      </tfoot>
    </table>

    <!-- 🔹 ACTION BUTTONS -->
    <div class="action-buttons">
      <a href="index.html" class="btn">← Back to Menu</a>

      <!-- 🔹 REQUIRED FOR PAYMENT -->
      <button id="proceedPayment" class="btn">
        Proceed to Payment →
      </button>
    </div>
  </div>

  <!-- YOUR UPDATED orders.js -->
  <script src="orders.js"></script>
</body>
</html>
